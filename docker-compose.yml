version: "3.8"

# Active repository runtime: host Nginx -> web Nginx -> app-fpm -> db.
# The root Apache Dockerfile and docker/apache-* files are historical reference
# only; no Apache service is defined here. phpMyAdmin is an opt-in tools profile.
services:
  app-fpm:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.fpm
    restart: unless-stopped
    environment:
      # Defaults to the Docker db service. Native-MariaDB migration can set
      # DB_HOST=host.docker.internal in the VM-only .env file.
      DB_HOST: ${DB_HOST:-db}
      PROXY_SECRET_TOKEN: ${PROXY_SECRET_TOKEN:-}
    expose:
      - "9000"
    volumes:
      - .:/var/www/html
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - db

  web:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/local-fpm.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app-fpm

  db:
    image: mysql:9.6
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS}
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      # One-time seed import (uncomment when ready):
      - ./u586058589_crimewiki_db2.sql:/docker-entrypoint-initdb.d/seed.sql:ro

  phpmyadmin:
    profiles:
      - tools
    image: phpmyadmin:latest
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_ABSOLUTE_URI: http://localhost:8082/
    depends_on:
      - db
    ports:
      - "127.0.0.1:8082:80"

volumes:
  db_data:
