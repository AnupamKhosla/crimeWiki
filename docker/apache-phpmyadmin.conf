# Historical Apache-only reference. The default Compose runtime is Nginx plus
# PHP-FPM, and phpMyAdmin is an opt-in tools profile without this proxy.
ProxyRequests Off
ProxyPreserveHost On

ProxyPass /phpmyadmin/ http://phpmyadmin:80/
ProxyPassReverse /phpmyadmin/ http://phpmyadmin:80/
ProxyPass /phpmyadmin http://phpmyadmin:80/
ProxyPassReverse /phpmyadmin http://phpmyadmin:80/
