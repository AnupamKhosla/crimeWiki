# Lightweight Apache hardening for small VMs.
#
# Protects against slow header/body attacks (slowloris) by enforcing
# minimum read rates and timeouts.
RequestReadTimeout header=20-40,MinRate=500 body=20,MinRate=500

# Basic request-rate limiting via mod_evasive.
# Tune values based on traffic. These are conservative defaults.
<IfModule mod_evasive20.c>
  DOSHashTableSize    2048
  DOSPageCount        20
  DOSSiteCount        80
  DOSPageInterval     1
  DOSSiteInterval     1
  DOSBlockingPeriod   10
</IfModule>
