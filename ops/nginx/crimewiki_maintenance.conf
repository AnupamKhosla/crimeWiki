# Reverse proxy (maintenance mode)
# This Nginx config serves a static maintenance page while deploys run. It keeps
# HTTPS active with the same certificate as the normal config, and it still
# proxies the webhook endpoint so you can retrigger a deploy if needed. The
# maintenance page is intentionally lightweight so the VM can handle traffic
# spikes even if the app stack is stopped or being updated. By serving a 503
# response with a friendly HTML page, clients and crawlers understand the
# downtime is temporary. You should never expose the app directly during deploys
# because file changes and DB migrations can cause half-rendered pages or errors.
# This file is generated from the repo template; don’t hand-edit it on the VM.
# When the deploy succeeds, the script switches back to the normal proxy config.
server {
  listen 80;
  server_name __DOMAIN__ __DOMAIN_WWW__;

  location /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  server_name __DOMAIN__ __DOMAIN_WWW__;

  ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;

  # Webhook endpoint (proxied to local webhook service)
  location /hooks/deploy {
    proxy_pass http://127.0.0.1:9000/hooks/deploy;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    root /var/www/maintenance;
    try_files /index.html =503;
  }

  error_page 503 /index.html;
}
