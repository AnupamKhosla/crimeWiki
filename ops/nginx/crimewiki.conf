# Reverse proxy (normal mode)
# This Nginx config is the public front door for the site. It listens on ports
# 80 and 443, performs the HTTPS redirect, and terminates TLS using the
# Let's Encrypt certificate. All application traffic is proxied to the internal
# app server on 127.0.0.1:8080, keeping your containers private. The webhook
# endpoint is also proxied to a local listener on 127.0.0.1:9000 so you do not
# need to open any extra firewall ports. This file is paired with a maintenance
# config that serves a static page during deploys. Do not edit this on the VM
# directly; treat it as a template and regenerate it via the setup scripts.
# If you change the domain or add more hostnames, update the placeholders and
# re-run the setup. Keeping this file simple makes failures obvious and ensures
# the proxy does not consume memory on small machines.
server {
  listen 80;
  server_name __DOMAIN__ __DOMAIN_WWW__;

  location /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  server_name __DOMAIN__ __DOMAIN_WWW__;

  ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;

  # Webhook endpoint (proxied to local webhook service)
  location /hooks/deploy {
    proxy_pass http://127.0.0.1:9000/hooks/deploy;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /rewrite_api.php {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;
    chunked_transfer_encoding on;
  }

  location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
