# Public Nginx entry point for the production VM.
# It serves the repository's audited static files directly and passes PHP to
# the private FPM container on 127.0.0.1:9070. The Docker `web` Nginx is only
# a local-development profile and is not part of the VPS request path.
server {
  listen 80;
  server_name __DOMAIN__ __DOMAIN_WWW__;

  location /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  server_name __DOMAIN__ __DOMAIN_WWW__;

  root __REPO_DIR__;
  index index.php;
  client_max_body_size 32m;
  include /etc/nginx/mime.types;
  types {
    application/manifest+json webmanifest;
    text/javascript mjs;
  }
  charset utf-8;
  server_tokens off;

  ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 4;
  gzip_types text/plain text/css text/javascript application/javascript application/json application/xml application/manifest+json image/svg+xml;

  # Webhook remains a host service and keeps its own loopback port.
  location /hooks/deploy {
    proxy_pass http://127.0.0.1:9000/hooks/deploy;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Preserve the original public phpMyAdmin URL. The container is reachable
  # only from the VM; this location is the sole public gateway to it.
  location = /phpmyadmin {
    return 301 /phpmyadmin/;
  }

  location ^~ /phpmyadmin/ {
    proxy_pass http://127.0.0.1:8082/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /phpmyadmin;
    proxy_cookie_path / /phpmyadmin/;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }

  # Never serve private repository/configuration paths directly.
  location ^~ /include/ { deny all; }
  location ^~ /scripts/ { deny all; }
  location ^~ /tmp/ { deny all; }
  location ^~ /docker/ { deny all; }
  location ^~ /ops/ { deny all; }
  location ^~ /docs/ { deny all; }

  # Keep old cached pages from requesting the former root manifest path.
  location = /site.webmanifest { return 301 $scheme://$http_host/assets/site.webmanifest; }

  location ~ (^|/)\.(?!well-known/) {
    deny all;
  }

  location ~* ^/(?:Dockerfile(?:\..*)?|docker-compose\.ya?ml|\.dockerignore|\.htaccess|AGENTS\.md|.*\.(?:env|ini|log|sql|sqlite|dist|bak|conf|yml|yaml|sh))$ {
    deny all;
  }

  location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|svg|webp|ico|webmanifest|woff|woff2|ttf)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=3600";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    access_log off;
  }

  # The manual AI preview stream must not be buffered and may be quiet between
  # heartbeat comments. It remains a small-pool exception, not the batch path.
  location = /rewrite_api.php {
    try_files $uri =404;
    include /etc/nginx/fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /var/www/html$fastcgi_script_name;
    fastcgi_param DOCUMENT_ROOT /var/www/html;
    fastcgi_pass 127.0.0.1:9070;
    fastcgi_buffering off;
    fastcgi_hide_header X-Powered-By;
    fastcgi_read_timeout 1800s;
    fastcgi_send_timeout 1800s;
  }

  location / {
    try_files $uri $uri/ @crimewiki_routes;
  }

  location @crimewiki_routes {
    rewrite ^/sitemap\.xml$ /sitemap/sitemap-index.php last;
    rewrite ^/sitemap/sitemap-index\.xml$ /sitemap/sitemap-index.php last;
    rewrite ^/sitemap/sitemap(\d+)\.xml$ /sitemap/sitemap.php?page=$1 last;
    rewrite ^/sitemap/sitemap(\d+)\.txt$ /sitemap/sitemap.php?page=$1 last;
    rewrite ^/proxy/(.+)$ /proxy.php?url=$1 last;
    rewrite ^/post/(\d+)/?$ /post.php?id=$1 last;
    rewrite ^/post/([^/]+)/(\d+)/?$ /post.php?title=$1&repeat=$2 last;
    rewrite ^/post/(.*?)/?$ /post.php?title=$1 last;
    rewrite ^/(.*?)/?$ /$1.php last;
    return 404;
  }

  location ~ \.php$ {
    try_files $uri =404;
    include /etc/nginx/fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /var/www/html$fastcgi_script_name;
    fastcgi_param DOCUMENT_ROOT /var/www/html;
    fastcgi_pass 127.0.0.1:9070;
    fastcgi_hide_header X-Powered-By;
    fastcgi_read_timeout 120s;
    fastcgi_send_timeout 120s;
  }
}
