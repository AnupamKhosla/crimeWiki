# This webhook configuration defines a single deploy endpoint. It listens for
# POST requests on /hooks/deploy and validates a shared secret header before
# running /usr/local/bin/deploy.sh. The webhook process itself only binds to
# localhost; Nginx proxies external traffic to it. This keeps the firewall
# simple (only 80/443 open) and prevents direct access to the webhook port. The
# deploy script handles maintenance mode, optional service stops, and git pulls.
# If you change the secret, re-run update_deploy.sh or setup_server.sh so the
# generated /etc/webhook/hooks.yml and the GitHub/GitLab webhook header match.
# Keep this file short and explicit; it is security-sensitive and should not
# accept unauthenticated requests. This YAML is used as a template; the setup
# scripts substitute __WEBHOOK_SECRET__ before installing it on the VM.

- id: deploy
  execute-command: /usr/local/bin/deploy.sh
  response-message: deploy triggered
  trigger-rule:
    match:
      type: value
      value: __WEBHOOK_SECRET__
      parameter:
        source: header
        name: X-Webhook-Secret
